<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rafa Assistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fa;--card:#fff;--ink:#3a2a33;--muted:#8c7a84;--rosa:#cd7990;--verde:#14bbb1;--rosa2:#fbe9ef;--line:#f0d6df;--ok:#2f9e6a;--bad:#c0392b}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
header .logo{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;border:1px solid var(--line);overflow:hidden}header .logo img{width:42px;height:42px;object-fit:contain}
header h1{font-size:17px;margin:0}header small{display:block;color:var(--muted);font-weight:400;font-size:12px}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:820px;margin:0 auto}
header,form,.aviso{width:100%}header>*,form>*{max-width:none}@media(min-width:900px){header{padding-left:calc(50% - 394px)}form{padding-left:calc(50% - 394px);padding-right:calc(50% - 394px)}}
.msg{max-width:min(720px,92%);padding:12px 14px;border-radius:16px;line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bot{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.user{background:var(--rosa);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.bot b{color:#b85a78}.bot ul,.bot ol{margin:4px 0 4px 18px;padding:0}
.meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:13px}
.meta button.on{background:var(--rosa2);border-color:var(--rosa)}
.fontes{font-size:12px;color:var(--muted);margin-top:6px}
form[hidden]{display:none}form{display:flex;gap:8px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;max-height:120px}
button.send{background:var(--rosa);color:#fff;border:0;border-radius:14px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer}
button.send:disabled{opacity:.5}
.gate{max-width:420px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px}
.gate input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px}
.gate p{margin:0;color:var(--muted);font-size:14px}
.typing{color:var(--muted);font-style:italic}
.aviso{font-size:12px;color:var(--muted);text-align:center;padding:4px 16px 0}
@media (prefers-color-scheme:dark){:root{--bg:#1d151a;--card:#2a1f25;--ink:#f3e8ed;--muted:#b39aa6;--rosa2:#4a2a38;--line:#4a3540}.bot b{color:#f0a3bb}}
</style>
</head>
<body>
<header><div class="logo"><img src="/logo.png" alt="Você Bailarina"></div><h1>Rafa Assistente <small>Você Bailarina · versão de teste</small></h1></header>
<main id="main">
  <div class="gate" id="gate">
    <img src="/logo.png" alt="Você Bailarina" style="width:120px;align-self:center;margin-bottom:4px"><h2 style="margin:0 0 4px;text-align:center">Oiê, professora!</h2>
    <p>Este é um teste fechado para assinantes. Digite seu nome e o código que você recebeu.</p>
    <input id="nome" placeholder="Seu nome" autocomplete="name">
    <input id="code" placeholder="Código de acesso" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button class="send" style="padding:10px" onclick="entrar()">Entrar</button>
    <p id="gateerr" style="color:var(--bad)"></p>
  </div>
</main>
<div class="aviso" id="aviso" hidden>A Rafa Assistente pode errar. Marque 👎 quando algo não fizer sentido: é assim que a Rafa melhora o assistente.</div>
<form id="form" hidden onsubmit="return enviar(event)">
  <textarea id="inp" rows="1" placeholder="Pergunte sobre aulas, método, datas, espetáculo…" required></textarea>
  <button class="send" id="btn">Enviar</button>
</form>
<script>
const main=document.getElementById('main'),form=document.getElementById('form'),inp=document.getElementById('inp'),btn=document.getElementById('btn');
let S={session:null,code:null,nome:null};
try{const s=localStorage.getItem('rafa_s');if(s)S=JSON.parse(s);}catch(e){}
S.session=S.session||crypto.randomUUID();
function md(t){ // markdown mínimo: **b**, *i*, listas, quebras
  t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*(?!\s)(.+?)\*(?=\s|[.,;:!?]|$)/g,'$1<i>$2</i>');
  const lines=t.split('\n');let out='',inl=null;
  for(const l of lines){const m=l.match(/^\s*(?:[-•]|(\d+)[.)])\s+(.*)/);
    if(m){const k=m[1]?'ol':'ul';if(inl!==k){if(inl)out+=`</${inl}>`;out+=`<${k}>`;inl=k}out+=`<li>${m[2]}</li>`}
    else{if(inl){out+=`</${inl}>`;inl=null}out+=l+'\n'}}
  if(inl)out+=`</${inl}>`;return out.replace(/\n{2,}/g,'\n\n').trim();}
function add(cls,html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;main.appendChild(d);main.scrollTop=main.scrollHeight;return d}
const ERR_COD='Código incorreto. Confira o código que você recebeu: letra maiúscula e minúscula fazem diferença.';
async function conferir(code){try{const r=await fetch('/api/entrar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});return r.ok?'ok':(r.status===401?'errado':'falha')}catch(e){return 'falha'}}
async function entrar(){const nome=document.getElementById('nome').value.trim(),code=document.getElementById('code').value.trim(),err=document.getElementById('gateerr');
  if(!nome||!code){err.textContent='Preencha nome e código.';return}
  err.textContent='Conferindo…';const v=await conferir(code);
  if(v==='errado'){err.textContent=ERR_COD;return}
  if(v==='falha'){err.textContent='Não consegui conferir agora. Verifique a internet e tente de novo.';return}
  err.textContent='';S.nome=nome;S.code=code;try{localStorage.setItem('rafa_s',JSON.stringify(S))}catch(e){}
  start();}
function sair(msg){try{localStorage.removeItem('rafa_s');sessionStorage.setItem('rafa_err',msg)}catch(e){}location.reload()}
async function start(){document.getElementById('gate')?.remove();form.hidden=false;document.getElementById('aviso').hidden=false;
  const r=await fetch('/api/abertura').then(r=>r.json());add('bot',md(r.texto));inp.focus();}
async function enviar(ev){ev.preventDefault();const q=inp.value.trim();if(!q)return;inp.value='';btn.disabled=true;
  add('user',md(q));const t=add('bot typing','Pensando…');
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:S.session,code:S.code,message:q,nome:S.nome})});
    if(r.status===401){t.remove();sair('Seu código de acesso mudou ou expirou. Digite o código novo para continuar.');return}
    const j=await r.json();t.classList.remove('typing');t.innerHTML=md(j.resposta);
    if(j.turn){const m=document.createElement('div');m.className='meta';m.innerHTML=`Essa resposta ajudou? <button onclick="fb(this,'${j.turn}',1)">👍</button><button onclick="fb(this,'${j.turn}',-1)">👎</button>`;t.appendChild(m)}
  }catch(e){t.innerHTML='Não consegui responder agora. Tente de novo em um minuto.'}
  btn.disabled=false;inp.focus();main.scrollTop=main.scrollHeight;}
async function fb(b,turn,v){const box=b.parentElement;[...box.querySelectorAll('button')].forEach(x=>x.classList.remove('on'));b.classList.add('on');
  let comment=null;if(v<0){comment=prompt('O que não ficou bom? (opcional)')||null}
  fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:S.session,code:S.code,turn,vote:v,comment})});
  const s=document.createElement('span');s.textContent=v>0?'Obrigada! 💗':'Anotado, obrigada. Vou aprender com isso.';box.appendChild(s);}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'});
try{const m=sessionStorage.getItem('rafa_err');if(m){document.getElementById('gateerr').textContent=m;sessionStorage.removeItem('rafa_err')}}catch(e){}
if(S.code&&S.nome){conferir(S.code).then(v=>{if(v==='errado'){try{localStorage.removeItem('rafa_s')}catch(e){};document.getElementById('gateerr').textContent='Seu código de acesso mudou. Digite o código novo para continuar.'}else start()})}
</script>
</body>
</html>
